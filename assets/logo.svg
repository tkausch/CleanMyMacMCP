<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CleanMyMacMCP logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B5BDB"/>
      <stop offset="0.55" stop-color="#2B8AEF"/>
      <stop offset="1" stop-color="#12C2C2"/>
    </linearGradient>
    <linearGradient id="disk" x1="150" y1="150" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E6FF"/>
    </linearGradient>
  </defs>

  <!-- app-icon rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- disk platter -->
  <circle cx="256" cy="262" r="118" fill="url(#disk)"/>
  <circle cx="256" cy="262" r="118" fill="none" stroke="#0B2A6B" stroke-opacity="0.12" stroke-width="4"/>
  <circle cx="256" cy="262" r="70" fill="none" stroke="#2B8AEF" stroke-opacity="0.35" stroke-width="10"/>
  <circle cx="256" cy="262" r="20" fill="#3B5BDB"/>

  <!-- sweep / read arc wiping the platter clean -->
  <path d="M256 144 A118 118 0 0 1 366 214" fill="none" stroke="#12C2C2" stroke-width="18" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M372 118 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z" fill="#FFFFFF"/>
  <path d="M418 210 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#FFFFFF" fill-opacity="0.9"/>
  <path d="M118 168 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- MCP connector prongs -->
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round">
    <line x1="212" y1="404" x2="212" y2="430"/>
    <line x1="256" y1="410" x2="256" y2="436"/>
    <line x1="300" y1="404" x2="300" y2="430"/>
  </g>
</svg>
